<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تفاصيل المنتج | متجر النور</title>
    <meta name="theme-color" content="#0A0A0F">
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .product-details-page { padding-bottom: calc(var(--bottom-nav-h) + 40px); }
        .product-hero-image {
            width: 100%; height: 350px; object-fit: cover;
            background: var(--bg-secondary); border-bottom: 1px solid var(--border);
        }
        .product-hero-placeholder {
            width: 100%; height: 350px; background: var(--bg-secondary);
            display: flex; align-items: center; justify-content: center;
            font-size: 5rem; color: var(--text-muted); border-bottom: 1px solid var(--border);
        }
        .product-meta-container { padding: 20px 16px; }
        .product-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 12px; line-height: 1.4; }
        .category-badge {
            display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
            background: rgba(200, 164, 92, 0.1); border: 1px solid var(--gold);
            border-radius: var(--radius-full); font-size: 0.8rem; font-weight: 600;
            color: var(--gold-light); margin-bottom: 16px;
        }
        .product-price-large { font-family: var(--font-en); font-size: 1.6rem; font-weight: 700; color: var(--gold); }
        .product-price-old-large { font-family: var(--font-en); font-size: 1rem; color: var(--text-muted); text-decoration: line-through; margin-right: 8px; }
        
        .description-box {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
            padding: 16px; margin: 24px 16px;
        }
        .description-box h3 { font-size: 1.1rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .description-box p { font-size: 0.95rem; line-height: 1.7; color: var(--text-secondary); white-space: pre-wrap; }
        
        .fixed-bottom-bar {
            position: fixed; bottom: var(--bottom-nav-h); left: 0; right: 0; z-index: 90;
            background: rgba(10, 10, 15, 0.95); backdrop-filter: blur(10px);
            padding: 12px 16px; border-top: 1px solid var(--border);
            display: flex; gap: 12px;
        }
        .fixed-bottom-bar .btn-primary { flex: 1; }
        .share-btn {
            width: 48px; height: 48px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-md); font-size: 1.2rem; transition: var(--transition);
        }
        .share-btn:hover { border-color: var(--gold); color: var(--gold); }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="back-header" style="margin: 0; padding: 0;">
            <a href="javascript:history.back()" class="back-btn">➔</a>
            <h1 class="page-title">تفاصيل المنتج</h1>
        </div>
        <div class="header-actions">
            <a href="./cart.html" class="header-btn">
                🛒<span class="cart-badge">0</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="page-content product-details-page" id="product-container">
        <div style="padding: 40px; text-align: center;">
            <div class="skeleton skeleton-image" style="height: 350px; border-radius: 0;"></div>
            <div style="padding: 20px;">
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text"></div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="./index.html" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span>الرئيسية</span>
        </a>
        <a href="./cart.html" class="nav-item">
            <span class="nav-icon">🛒</span>
            <span>السلة</span>
            <span class="nav-badge cart-badge">0</span>
        </a>
    </nav>

    <!-- Scripts -->
    <script src="./js/config.js"></script>
    <script src="./js/product.js"></script>
</body>
</html>
