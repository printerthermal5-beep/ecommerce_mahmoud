<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إتمام الشراء | الرايق لبيع الانتيكات والتحف</title>
    <meta name="description" content="إتمام طلب الأنتيكات والتحف من متجر الرايق لبيع الأنتيكات والتحف.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://printerthermal5-beep.github.io/ecommerce_mahmoud/checkout.html">
    <meta name="theme-color" content="#0A0A0F">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="back-header" style="margin: 0; padding: 0;">
            <a href="./cart.html" class="back-btn">➔</a>
            <h1 class="page-title">إتمام الشراء</h1>
        </div>
    </header>

    <!-- Main Content -->
    <main class="page-content checkout-page" id="checkout-main">
        
        <!-- Order Summary Card -->
        <div class="order-summary-card animate-in">
            <h3>ملخص الطلب</h3>
            <div id="checkout-items">
                <!-- Items injected here -->
            </div>
            <div style="border-top: 1px solid var(--border); margin-top: 10px; padding-top: 10px; display: flex; justify-content: space-between; font-weight: 700;">
                <span>الإجمالي:</span>
                <span id="checkout-total" style="color: var(--gold-light); font-family: var(--font-en);">0 ج.م</span>
            </div>
        </div>

        <!-- Checkout Form -->
        <form id="checkout-form" class="animate-in" style="animation-delay: 0.1s;">
            <div class="form-group">
                <label class="form-label">الاسم بالكامل *</label>
                <input type="text" id="cust-name" class="form-input" placeholder="اكتب اسمك الثلاثي" required>
                <div class="form-error" id="name-error">برجاء إدخال الاسم</div>
            </div>

            <div class="form-group">
                <label class="form-label">رقم الموبايل *</label>
                <input type="tel" id="cust-phone" class="form-input" placeholder="مثال: 010xxxxxxxx" required>
                <div class="form-error" id="phone-error">برجاء إدخال رقم موبايل صحيح (11 رقم)</div>
            </div>

            <div class="form-group">
                <label class="form-label">العنوان بالتفصيل *</label>
                <textarea id="cust-address" class="form-textarea" placeholder="المحافظة، المنطقة، الشارع، رقم العمارة/الشقة" required></textarea>
                <div class="form-error" id="address-error">برجاء إدخال العنوان بالتفصيل</div>
            </div>

            <div class="form-group">
                <label class="form-label">ملاحظات إضافية (اختياري)</label>
                <textarea id="cust-notes" class="form-textarea" placeholder="أي ملاحظات خاصة بالتوصيل..."></textarea>
            </div>

            <button type="submit" class="btn-primary" id="submit-btn" style="margin-top: 24px; margin-bottom: 30px;">
                تأكيد الطلب <span>✓</span>
            </button>
        </form>
    </main>

    <!-- Success State (Hidden initially) -->
    <main class="page-content" id="success-main" style="display: none;">
        <div class="success-container">
            <div class="success-icon">✓</div>
            <h2>تم تسجيل طلبك بنجاح!</h2>
            <p>سيتم تحويلك الآن للواتساب إرسال تفاصيل الطلب لتأكيده.</p>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 20px;">
                رقم الطلب: <span id="order-id-display" style="font-family: var(--font-en); font-weight: 700; color: var(--text-primary);"></span>
            </p>
            <a id="wa-fallback-btn" href="#" target="_blank" rel="noopener" class="btn-primary" style="margin-top: 20px;">
                إرسال التفاصيل على واتساب 💬
            </a>
            <button class="btn-secondary" onclick="window.location.href='./index.html'" style="margin-top: 16px;">
                العودة للرئيسية
            </button>
        </div>
    </main>

    <!-- Scripts -->
    <script src="./js/config.js"></script>
    <script src="./js/checkout.js"></script>
</body>
</html>
