<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متجر النور | كماليات وأنتيكات</title>
    <meta name="description" content="متجر النور لبيع أفخم الكماليات والأنتيكات والتحف والفازات">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0A0A0F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Open Graph Social Sharing -->
    <meta property="og:title" content="متجر النور للأنتيكات والتحف">
    <meta property="og:description" content="تشكيلة حصرية وفخمة من التحف والفازات والكماليات المنزلية النادرة.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="متجر النور">

    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
    
    <!-- Styles -->
    <link rel="stylesheet" href="./css/style.css">
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Floating WhatsApp Support Button -->
    <a href="https://wa.me/2001222462607?text=مرحباً%20متجر%20النور،%20أريد%20الاستفسار%20عن%20منتجاتكم" target="_blank" rel="noopener" class="floating-whatsapp-btn" title="تحدث معنا على واتساب" onclick="triggerHaptic()">
        💬
    </a>
    <!-- Announcement Bar -->
    <div class="announcement-bar">
        <span>✨ أهلاً بكم في متجر النور - وجهتكم الأولى لأفخم الأنتيكات والكماليات ✨</span>
    </div>

    <!-- Header -->
    <header class="header" style="justify-content: center; top: var(--announcement-h);">
        <h1 class="header-title">النور للأنتيكات</h1>
    </header>

    <!-- Main Content -->
    <main class="page-content" style="padding-top: calc(var(--header-h) + var(--announcement-h) + 20px);">
        <!-- Hero Banner -->
        <div class="hero-banner animate-in">
            <h2>أضف لمسة من الفخامة<br>لمنزلك</h2>
            <p>اكتشف تشكيلتنا الحصرية من التحف والفازات النادرة</p>
        </div>

        <!-- Search & Sorting -->
        <div class="search-container animate-in" style="animation-delay: 0.1s;">
            <div class="search-bar">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="ابحث عن تحف، فازات، كماليات...">
                <select id="sort-select" style="background:transparent; border:none; color:var(--gold-light); font-size:0.8rem; outline:none; cursor:pointer; padding:0 8px;" onchange="handleSortChange(this.value)">
                    <option value="default" style="background:var(--bg-card); color:var(--text-primary);">الأحدث 🆕</option>
                    <option value="sale" style="background:var(--bg-card); color:var(--text-primary);">العروض فقط 🔥</option>
                    <option value="price-low" style="background:var(--bg-card); color:var(--text-primary);">السعر: من الأقل للأعلى ⬆️</option>
                    <option value="price-high" style="background:var(--bg-card); color:var(--text-primary);">السعر: من الأعلى للأقل ⬇️</option>
                </select>
            </div>
        </div>

        <!-- Categories -->
        <section class="categories-section animate-in" style="animation-delay: 0.2s;">
            <h2 class="section-title">التصنيفات</h2>
            <div class="categories-scroll" id="categories-scroll">
                <!-- Categories loaded dynamically -->
                <div class="skeleton skeleton-text" style="width: 100px; height: 35px; border-radius: 20px;"></div>
                <div class="skeleton skeleton-text" style="width: 100px; height: 35px; border-radius: 20px;"></div>
                <div class="skeleton skeleton-text" style="width: 100px; height: 35px; border-radius: 20px;"></div>
            </div>
        </section>

        <!-- Products -->
        <section class="products-section animate-in" style="animation-delay: 0.3s;">
            <h2 class="section-title">أحدث المنتجات</h2>
            <div class="products-grid" id="products-grid">
                <!-- Products loaded dynamically -->
            </div>
        </section>

        <!-- Footer -->
        <footer class="store-footer"></footer>
    </main>

    <!-- PWA Install Banner -->
    <div class="install-banner" id="install-banner">
        <div class="install-banner-icon">📱</div>
        <div class="install-banner-text">
            <h4>ثبت التطبيق الآن!</h4>
            <p>احصل على تجربة تسوق أسرع وأفضل</p>
        </div>
        <button class="install-btn" onclick="installPWA()">تثبيت</button>
        <button class="install-close" onclick="dismissInstallBanner()">✕</button>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="./index.html" class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>الرئيسية</span>
        </a>
        <a href="./wishlist.html" class="nav-item">
            <span class="nav-icon">❤️</span>
            <span>المفضلة</span>
            <span class="wishlist-badge nav-badge" style="background:var(--error); color:#fff;">0</span>
        </a>
        <a href="./cart.html" class="nav-item">
            <span class="nav-icon">🛒</span>
            <span>السلة</span>
            <span class="nav-badge cart-badge">0</span>
        </a>
        <a href="./orders.html" class="nav-item">
            <span class="nav-icon">📦</span>
            <span>طلباتي</span>
        </a>
    </nav>

    <!-- Scripts -->
    <script src="./js/config.js"></script>
    <script src="./js/store.js"></script>
</body>
</html>
